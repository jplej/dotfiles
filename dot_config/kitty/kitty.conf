# =========================
# Kitty main config
# =========================

# Include the Nord theme from kitty-themes
include ~/.config/kitty/kitty-themes/themes/Nord.conf

# Optional: cursor, font, and window settings
cursor_shape block
cursor_beam_thickness 2

font_family "JetBrainsMono Nerd Font Mono"
font_size 12.0

# Scrollback
scrollback_lines 10000

# Window padding (optional, makes it look nicer)
window_padding_width 10
