[colors]
background = #2e3440
foreground = #d8dee9
dim = #616e88
accent = #88c0d0
urgent = #bf616a
good = #a3be8c
warn = #ebcb8b
separator = #3b4252

; ============================================================
; BAR
; ============================================================

[bar/status]
bottom = true
width = 100%
height = 40
fixed-center = false
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=13;5
font-1 = JetBrainsMono Nerd Font:size=15;6
modules-left = xworkspaces wifi-btn bt-btn vol-btn
modules-center = xwindow
modules-right = cpu memory temperature brightness bt-status vol-status battery net-status datemod timemod
cursor-click = pointer
enable-ipc = true
override-redirect = false

; ============================================================
; SEPARATOR
; ============================================================

[module/sep]
type = custom/text
content = "·"
content-foreground = ${colors.dim}
content-padding = 1

; ============================================================
; ACTIONS — accent icons, clickable, no text
; ============================================================

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
label-active = " %index% "
label-active-foreground = ${colors.background}
label-active-background = ${colors.accent}
label-active-padding = 0
label-occupied = %index%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-empty = %index%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1
label-urgent = %index%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1

[module/wifi-btn]
type = custom/text
content = "󰤨"
content-foreground = ${colors.accent}
click-left = nm-connection-editor &

[module/bt-btn]
type = custom/text
content = "󰂯"
content-foreground = ${colors.accent}
click-left = blueman-manager &

[module/vol-btn]
type = custom/text
content = "󰕾"
content-foreground = ${colors.accent}
click-left = pavucontrol &
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +2%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -2%

; ============================================================
; CONTEXT — passive, dim
; ============================================================

[module/xwindow]
type = internal/xwindow
label = "%title%"
label-foreground = ${colors.dim}
label-maxlen = 50
label-empty =

; ============================================================
; STATUS: DIAGNOSTICS — low frequency, dim, warn/urgent on threshold
; ============================================================

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = "CPU:"
format-prefix-foreground = ${colors.dim}
label = %percentage%%
label-foreground = ${colors.dim}
warn-percentage = 80
format-warn-prefix = "CPU:"
format-warn-prefix-foreground = ${colors.urgent}
label-warn = %percentage%%
label-warn-foreground = ${colors.urgent}

[module/memory]
type = internal/memory
interval = 5
format-prefix = "RAM:"
format-prefix-foreground = ${colors.dim}
label = %percentage_used%%
label-foreground = ${colors.dim}
warn-percentage = 80
format-warn-prefix = "RAM:"
format-warn-prefix-foreground = ${colors.urgent}
label-warn = %percentage_used%%
label-warn-foreground = ${colors.urgent}

[module/temperature]
type = internal/temperature
interval = 5
thermal-zone = 9
base-temperature = 30
warn-temperature = 75
format-prefix = "TMP:"
format-prefix-foreground = ${colors.dim}
label = %temperature-c%
label-foreground = ${colors.dim}
format-warn-prefix = "TMP:"
format-warn-prefix-foreground = ${colors.urgent}
label-warn = %temperature-c%
label-warn-foreground = ${colors.urgent}

[module/brightness]
type = custom/script
exec = b=$(cat /sys/class/backlight/intel_backlight/brightness); m=$(cat /sys/class/backlight/intel_backlight/max_brightness); p=$((b * 100 / m)); echo "$p%"
interval = 5
format-prefix = "BRI:"
format-prefix-foreground = ${colors.dim}
label-foreground = ${colors.dim}

[module/bt-status]
type = custom/script
exec = bluetoothctl show 2>/dev/null | grep -q "Powered: yes" && echo "on" || echo "off"
interval = 10
format-prefix = "BT:"
format-prefix-foreground = ${colors.dim}
label-foreground = ${colors.dim}

; ============================================================
; STATUS: MEDIUM FREQUENCY
; ============================================================

[module/vol-status]
type = custom/script
exec = v=$(pactl get-sink-volume @DEFAULT_SINK@ 2>/dev/null | grep -oP '\\d+%' | head -1); m=$(pactl get-sink-mute @DEFAULT_SINK@ 2>/dev/null | grep -oP 'yes|no'); if [ "$m" = "yes" ]; then echo "muted"; else echo "$v"; fi
interval = 3
format-prefix = "VOL:"
format-prefix-foreground = ${colors.dim}
label-foreground = ${colors.dim}

; ============================================================
; STATUS: OPERATIONAL — high frequency, dim, warn/urgent on threshold
; ============================================================

[module/battery]
type = custom/script
exec = c=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null); if [ "$c" -lt 10 ] 2>/dev/null; then echo "%{F#bf616a}BAT:$c%%{F-}"; elif [ "$c" -lt 20 ] 2>/dev/null; then echo "%{F#ebcb8b}BAT:$c%%{F-}"; else echo "BAT:$c%"; fi
interval = 30
format-foreground = ${colors.dim}

[module/net-status]
type = custom/script
exec = ssid=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep '^yes' | cut -d: -f2); if [ -n "$ssid" ]; then echo "NET:$ssid"; else echo "%{F#bf616a}NET:disconnected%{F-}"; fi
interval = 10
format-foreground = ${colors.dim}

; ============================================================
; CLOCK — foreground, no prefix, no icon
; ============================================================

[module/datemod]
type = custom/script
exec = date '+%Y-%m-%d'
interval = 60
label-foreground = ${colors.foreground}

[module/timemod]
type = custom/script
exec = date '+%H:%M'
interval = 30
label-foreground = ${colors.foreground}
