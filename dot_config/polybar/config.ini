# Nord, named by meaning, not by decoration. Frost = where you are. Aurora = what happened.
# Keep these names in sync with i3/config, rofi/nord-deskbar.rasi and polybar/colors.sh.
[colors]
; grounds
well    = #2E3440
face    = #3B4252
face-hi = #434C5E
line    = #4C566A
shadow  = #2E3440
; text
text    = #ECEFF4
; #616E88 is off-palette (a brightened nord3), not Nord proper — kept deliberately
idle    = #616E88
; where you are
focus   = #88C0D0
; what happened
warn    = #EBCB8B
error   = #BF616A

[bar/deskbar]
; Set per-instance by launch.sh (one polybar per connected output); falls back to the laptop
monitor = ${env:MONITOR:eDP-1}
bottom = true
; i3 stretches docks to the output width; width/offset-x are ignored
width = 100%
offset-x = 0
offset-y = 0
height = 44
radius = 0
fixed-center = false

background = ${colors.well}
foreground = ${colors.text}

; Brightest stop of the top-lit ramp: bar lip lighter than the module lips below it
border-top-size = 2
border-top-color = ${colors.idle}

padding = 0
module-margin = 0
line-size = 2

; Proportional face for chrome — a code font made the bar read like content. Text only; every icon selects T2.
font-0 = Lato:style=Medium:size=11;3
; Mono variant is mandatory: plain Nerd Font draws icons double-width and polybar clips them
font-1 = JetBrainsMono Nerd Font Mono:size=14;4
; Bold slot (%{T3}) — weight encodes kind: keys and mode names, not body chrome
font-2 = Lato:style=Bold:size=11;3

modules-left = workspaces
modules-right = cpu memory temperature sep mic camera keyboard brightness volume network bluetooth battery sep clock

enable-ipc = true
cursor-click = pointer
override-redirect = false

[bar/deskbar-primary]
; Primary output only: the base bar plus a collapsible system tray (chevron toggles it)
inherit = bar/deskbar
modules-right = cpu memory temperature sep mic camera keyboard brightness volume network bluetooth battery sep clock tray-toggle tray

[module/tray]
type = internal/tray
; Hidden until the chevron toggles it, so icons stay out of the way
hidden = true
tray-background = ${colors.well}
tray-size = 66%
tray-padding = 4
tray-spacing = 4

[module/tray-toggle]
type = custom/text
; Chevron acts like the Windows "show hidden icons" button — click to reveal/collapse the tray
format = "%{T2}󰄾%{T-}"
format-foreground = ${colors.idle}
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2
click-left = polybar-msg action tray module_toggle

[module/sep]
type = custom/text
format = "  "
format-background = ${colors.well}

[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-mode> <label-state>

; Icons map by workspace name; number stays the address via %index%, glyph is the label
; Static by design — reflects each workspace's assigned job, not live content
ws-icon-0 = 2;󰖟
ws-icon-1 = 3;󰈙
ws-icon-2 = 8;󰭹
ws-icon-3 = 9;󰇮
ws-icon-default =

label-mode = %mode%
; Ground matches the bar: the crib builds its own Frost badge with %{B} tags instead
label-mode-background = ${colors.well}
label-mode-foreground = ${colors.text}
label-mode-overline = ${colors.line}
label-mode-underline = ${colors.shadow}
label-mode-padding = 3

label-focused = %index% %{T2}%icon%%{T-}
label-focused-background = ${colors.well}
label-focused-foreground = ${colors.focus}
label-focused-overline = ${colors.shadow}
label-focused-underline = ${colors.line}
label-focused-padding = 3

label-unfocused = %index% %{T2}%icon%%{T-}
label-unfocused-background = ${colors.face}
label-unfocused-foreground = ${colors.text}
label-unfocused-overline = ${colors.line}
label-unfocused-underline = ${colors.shadow}
label-unfocused-padding = 3

label-visible = %index% %{T2}%icon%%{T-}
label-visible-background = ${colors.face}
label-visible-foreground = ${colors.text}
label-visible-overline = ${colors.line}
label-visible-underline = ${colors.shadow}
label-visible-padding = 3

label-urgent = %index% %{T2}%icon%%{T-}
label-urgent-background = ${colors.error}
label-urgent-foreground = ${colors.text}
label-urgent-overline = ${colors.line}
label-urgent-underline = ${colors.shadow}
label-urgent-padding = 3

[module/cpu]
type = internal/cpu
interval = 3
warn-percentage = 80

format = <label>
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2
label = "%{T2}󰓅%{T-} %percentage%%"
label-foreground = ${colors.idle}

format-warn = <label-warn>
format-warn-background = ${colors.face}
format-warn-overline = ${colors.line}
format-warn-underline = ${colors.shadow}
format-warn-padding = 2
label-warn = "%{T2}󰓅%{T-} %percentage%%"
label-warn-foreground = ${colors.warn}

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 85

format = <label>
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2
label = "%{T2}󰍛%{T-} %percentage_used%%"
label-foreground = ${colors.idle}

format-warn = <label-warn>
format-warn-background = ${colors.face}
format-warn-overline = ${colors.line}
format-warn-underline = ${colors.shadow}
format-warn-padding = 2
label-warn = "%{T2}󰍛%{T-} %percentage_used%%"
label-warn-foreground = ${colors.warn}

[module/temperature]
type = internal/temperature
interval = 3
; zone 10 = x86_pkg_temp (zone 9 is TCPU_PCI, a different chip)
thermal-zone = 10
base-temperature = 30
warn-temperature = 75

format = <label>
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2
label = "%{T2}󰔏%{T-} %temperature-c%"
label-foreground = ${colors.idle}

format-warn = <label-warn>
format-warn-background = ${colors.face}
format-warn-overline = ${colors.line}
format-warn-underline = ${colors.shadow}
format-warn-padding = 2
label-warn = "%{T2}󰔏%{T-} %temperature-c%"
label-warn-foreground = ${colors.warn}

[module/volume]
type = custom/script
exec = ~/.config/polybar/volume.sh
; Event-driven: pactl pushes, the script streams. Was interval-polled at ~450ms lag.
tail = true

format = <label>
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2

[module/network]
type = internal/network
interface-type = wireless
interval = 10

format-connected = <label-connected>
format-connected-background = ${colors.face}
format-connected-overline = ${colors.line}
format-connected-underline = ${colors.shadow}
format-connected-padding = 2
label-connected = "%{T2}󰤨%{T-} %essid%"
label-connected-maxlen = 24
label-connected-ellipsis = true
label-connected-foreground = ${colors.idle}

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.face}
format-disconnected-overline = ${colors.line}
format-disconnected-underline = ${colors.shadow}
format-disconnected-padding = 2
label-disconnected = "%{T2}󰤭%{T-} off"
label-disconnected-foreground = ${colors.error}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 15
poll-interval = 30

ramp-capacity-font = 2
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-foreground = ${colors.idle}

format-discharging = <ramp-capacity><label-discharging>
format-discharging-background = ${colors.face}
format-discharging-overline = ${colors.line}
format-discharging-underline = ${colors.shadow}
format-discharging-padding = 2
label-discharging = " %percentage%%"
label-discharging-foreground = ${colors.idle}

format-charging = <label-charging>
format-charging-background = ${colors.face}
format-charging-overline = ${colors.line}
format-charging-underline = ${colors.shadow}
format-charging-padding = 2
label-charging = "%{T2}󰂄%{T-} %percentage%%"
label-charging-foreground = ${colors.idle}

format-full = <label-full>
format-full-background = ${colors.face}
format-full-overline = ${colors.line}
format-full-underline = ${colors.shadow}
format-full-padding = 2
label-full = "%{T2}󰁹%{T-} %percentage%%"
label-full-foreground = ${colors.idle}

format-low = <label-low>
format-low-background = ${colors.face}
format-low-overline = ${colors.line}
format-low-underline = ${colors.shadow}
format-low-padding = 2
label-low = "%{T2}󰂃%{T-} %percentage%%"
label-low-foreground = ${colors.warn}

[module/mic]
type = custom/script
exec = ~/.config/polybar/mic.sh
; Event-driven: pactl pushes, the script streams. Was interval-polled at ~450ms lag.
tail = true
format = <label>
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2

[module/camera]
type = custom/script
exec = ~/.config/polybar/cam.sh
; No event source (no pactl equivalent), so poll the sensor runtime PM.
interval = 2
format = <label>
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 5
format = <label>
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2

[module/brightness]
type = custom/script
exec = ~/.config/polybar/brightness.sh
; Event-driven: udev pushes backlight changes. Was polled 1/s for an event that never fires.
tail = true
format = <label>
format-background = ${colors.face}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout><label-indicator>

layout-icon-0 = us;US
layout-icon-1 = ca;CA
label-layout = "%{T2}󰌌%{T-} %icon%"
label-layout-background = ${colors.face}
label-layout-foreground = ${colors.idle}
label-layout-overline = ${colors.line}
label-layout-underline = ${colors.shadow}
label-layout-padding = 2

; indicator-icon = <name>;<off>;<on> — only the on state renders, label-indicator-off is empty
indicator-icon-0 = caps lock;;%{T2}󰪛%{T-} CAPS
label-indicator-on = %icon%
label-indicator-on-background = ${colors.face}
label-indicator-on-foreground = ${colors.warn}
label-indicator-on-overline = ${colors.line}
label-indicator-on-underline = ${colors.shadow}
label-indicator-on-padding = 2
label-indicator-off =

[module/clock]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = "%date%  %time%"

format = <label>
format-background = ${colors.face-hi}
format-overline = ${colors.line}
format-underline = ${colors.shadow}
format-padding = 2
label-foreground = ${colors.text}
