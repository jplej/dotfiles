backend = "glx";
# vsync on: the tearing this was trading away was the actual screen corruption
vsync = true;
# damage tracking back on: stale frames on DP-2-3 were likely a vsync=false artifact
use-damage = true;
# fullscreen video bypasses the compositor entirely; picom v10 defaults this off
unredir-if-possible = true;

# NeXTSTEP drop shadow: cached per window, not a per-frame cost
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.7;
shadow-offset-x = -15;
shadow-offset-y = -10;
shadow-color = "#000000";

# Symmetric fade, shortened to ~100ms each way: transient cost only
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 6;

# Sharp square corners, authentic to both BeOS and NeXT. No rounding.
corner-radius = 0;

# inactive-opacity and inactive-dim dropped: they forced a per-frame blend on every unfocused window
frame-opacity = 1.0;

detect-rounded-corners = true;
detect-client-opacity = true;

# Don't cast shadows on the bar, desktop, or i3 internal frames.
shadow-exclude = [
  "class_g = 'i3-frame'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DOCK'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DESKTOP'",
  # GTK menus reserve invisible CSD margin, so picom's shadow detaches into a hard-edged box
  "_NET_WM_WINDOW_TYPE@:a *= 'MENU'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DROPDOWN_MENU'",
  "_NET_WM_WINDOW_TYPE@:a *= 'POPUP_MENU'",
  "_NET_WM_WINDOW_TYPE@:a *= 'TOOLTIP'"
];
