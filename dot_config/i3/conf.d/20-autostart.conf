# ─── Autostart reserved apps ───────────────────────────────────────────────
# exec (not exec_always) so a reload never spawns duplicates
exec --no-startup-id flatpak run com.brave.Browser
# exec --no-startup-id zettlr
exec --no-startup-id flatpak run org.telegram.desktop
exec --no-startup-id flatpak run eu.betterbird.Betterbird

# ─── Autostart daemons ─────────────────────────────────────────────────────
exec_always --no-startup-id autorandr --change
# Wallpaper from the local copy (instant, always works); sync refreshes it from pCloud once per login
exec_always --no-startup-id ~/.config/i3/wallpaper.sh
exec        --no-startup-id ~/.config/i3/wallpaper-sync.sh
# Cursor: load size/theme (no DE to do it) and force root cursor to redraw,
# so the empty-desktop cursor matches apps instead of a big unpinned fallback.
exec_always --no-startup-id xrdb -merge ~/.Xresources
exec_always --no-startup-id xsetroot -cursor_name left_ptr
exec        --no-startup-id dunst
# Re-enabled 2026-07-17: now earns its cost — inactive-dim depth, snappy fades, vsync.
exec_always --no-startup-id picom
exec        --no-startup-id xfce4-power-manager --daemon
exec        --no-startup-id nm-applet
exec        --no-startup-id blueman-applet
exec        --no-startup-id pcloud
exec        --no-startup-id greenclip daemon
exec        --no-startup-id gammastep
exec        --no-startup-id xss-lock --transfer-sleep-lock -- ~/.config/i3/lock.sh
