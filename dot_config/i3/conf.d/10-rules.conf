# ─── Window rules ──────────────────────────────────────────────────────────
# Float things that tile badly — file pickers, utility pop-ups — instead of
# wedging them into the layout.
for_window [window_type="dialog"]               floating enable
for_window [window_role="pop-up"]               floating enable
for_window [window_role="GtkFileChooserDialog"] floating enable

# Ghostty sets _MOTIF_WM_HINTS decorations=0, so i3 draws no border and focus is invisible — override it
for_window [class="com.mitchellh.ghostty"] border pixel 3

# App homes — windows are BORN on their workspace, then move freely (assign only sets birthplace)
assign [class="Brave-browser"]            → workspace number 4
assign [class="Zettlr"]                   → workspace number 5
# Bare "libreoffice" matches -writer/-calc/-impress alike
assign [class="libreoffice"]              → workspace number 5
assign [class="Thunar"]                   → workspace number 5
assign [class="eu.betterbird.Betterbird"] → workspace number 6
assign [class="TelegramDesktop"]          → workspace number 7

# 1Password always floats centered instead of tiling; case-insensitive to catch every packaging variant
for_window [class="(?i)1password"] floating enable, resize set 900 600, move position center
