# ─── Base ──────────────────────────────────────────────────────────────────
# $mod/$alt/$term and the Nord color vars are defined in ../config before the include.

# Proportional face for chrome; mono lives in the terminal, where content is
font pango:Lato Medium 11

# Window borders + gaps
# 3px so the focused-window accent border (client.focused, below) is actually
# visible — at 2px the highlight was too thin to tell active from inactive.
default_border pixel 3
default_floating_border pixel 3
gaps inner 12
gaps outer 12
# Keep gaps even for a lone window so its drop shadow can cast on the wallpaper.
smart_gaps off
hide_edge_borders smart

# Keyboard-driven: focus follows keys, never the mouse. mouse_warping none stops
# the cursor teleporting onto each window you focus across outputs.
focus_follows_mouse no
mouse_warping none

# ─── Colors ────────────────────────────────────────────────────────────────
# class                 border   backgr.  text    indicator  child_border
client.focused          $focus   $bg2     $fg     $focus     $focus
client.focused_inactive $border  $bg2     $fg     $border    $border
# Unfocused frames melt into the dark so the focused frost border pops
client.unfocused        $bg      $bg      $fg     $border    $bg
client.urgent           $error   $error   $fg     $error     $error
