# ─── Window mode — the memory helper ───────────────────────────────────────
# Hand-written, not generated: resize (hjkl) LINGERS and the verbs are raw i3
# commands, not the uniform exec-and-snap-back rows bin/gen-modes.py emits.
# Same grammar as the generated modes: $mod+w ARMS it, the crib label shows on
# polybar the whole time, bare keys pick, Escape backs out changing nothing.
set $win %{B#EBCB8B}%{F#2E3440}%{T3} WINDOW %{T-}%{F-}%{B-}%{O16}%{T2}%{F#EBCB8B}󰩨%{F-}%{T-}%{O7}%{T3}%{F#EBCB8B}hjkl%{F-}%{T-}%{O5}resize%{O16}%{T2}%{F#EBCB8B}󰊓%{F-}%{T-}%{O7}%{T3}%{F#EBCB8B}f%{F-}%{T-}%{O5}full%{O16}%{T2}%{F#EBCB8B}󰋱%{F-}%{T-}%{O7}%{T3}%{F#EBCB8B}space%{F-}%{T-}%{O5}float%{O16}%{T2}%{F#EBCB8B}󰤻%{F-}%{T-}%{O7}%{T3}%{F#EBCB8B}s%{F-}%{T-}%{O5}split%{O16}%{T2}%{F#EBCB8B}󰍹%{F-}%{T-}%{O7}%{T3}%{F#EBCB8B}o%{F-}%{T-}%{O5}monitor%{O16}%{T2}%{F#EBCB8B}󰖲%{F-}%{T-}%{O7}%{T3}%{F#EBCB8B}w%{F-}%{T-}%{O5}switch
mode "$win" {
    # resize — stays armed, nudge as many times as you like
    bindsym h     resize shrink width  10 px or 5 ppt
    bindsym j     resize grow   height 10 px or 5 ppt
    bindsym k     resize shrink height 10 px or 5 ppt
    bindsym l     resize grow   width  10 px or 5 ppt
    bindsym Left  resize shrink width  10 px or 5 ppt
    bindsym Down  resize grow   height 10 px or 5 ppt
    bindsym Up    resize shrink height 10 px or 5 ppt
    bindsym Right resize grow   width  10 px or 5 ppt

    # do-once verbs — fire and snap back
    bindsym f       fullscreen toggle,               mode "default"
    bindsym space   floating toggle,                 mode "default"
    bindsym s       layout toggle split,             mode "default"
    bindsym o       move workspace to output right,   mode "default"
    bindsym Shift+o focus output right,               mode "default"
    bindsym w       exec --no-startup-id rofi -show window, mode "default"

    bindsym Escape mode "default"
    bindsym Return mode "default"
}
bindsym $mod+w mode "$win"
