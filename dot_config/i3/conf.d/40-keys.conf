# ─── Flat keybindings (outside any mode) ───────────────────────────────────
bindsym Ctrl+$alt+l exec --no-startup-id ~/.config/i3/lock.sh

# Screenshots — flameshot instead of xfce4-screenshooter.
# $mod+p is the primary: the Ergodox has no dedicated Print key.
bindsym $mod+p        exec --no-startup-id flameshot gui
bindsym Print         exec --no-startup-id flameshot full -c
bindsym $alt+Print    exec --no-startup-id flameshot gui
bindsym Shift+Print   exec --no-startup-id flameshot gui

# System actions. Logout/reboot/shutdown live in the session mode (33-session.conf).
bindsym Ctrl+$alt+Escape exec --no-startup-id xkill

# Toggle keyboard layout us <-> ca
bindsym $mod+i exec --no-startup-id ~/.config/i3/layout-toggle.sh

# Media / brightness / volume keys
bindsym XF86AudioRaiseVolume  exec --no-startup-id pamixer -i 5
bindsym XF86AudioLowerVolume  exec --no-startup-id pamixer -d 5
bindsym XF86AudioMute         exec --no-startup-id pamixer -t
bindsym XF86AudioMicMute      exec --no-startup-id pamixer --default-source -t
bindsym XF86MonBrightnessUp   exec --no-startup-id brightnessctl set +5%
bindsym XF86MonBrightnessDown exec --no-startup-id brightnessctl set 5%-
bindsym XF86Display           exec --no-startup-id autorandr --cycle

# ─── Window management ─────────────────────────────────────────────────────
# Kill focused window — XFCE was Super+d. Keep muscle memory.
bindsym $mod+d           kill
bindsym $mod+Shift+q     kill

# Focus — hjkl (Helix home row) and arrows both work
bindsym $mod+h           focus left
bindsym $mod+j           focus down
bindsym $mod+k           focus up
bindsym $mod+l           focus right
bindsym $mod+Left        focus left
bindsym $mod+Down        focus down
bindsym $mod+Up          focus up
bindsym $mod+Right       focus right

# Move focused window
bindsym $mod+Shift+h     move left
bindsym $mod+Shift+j     move down
bindsym $mod+Shift+k     move up
bindsym $mod+Shift+l     move right
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right

# Window verbs you don't do constantly — resize, fullscreen, float, split,
# monitor — live in the $mod+w WINDOW mode (32-window.conf), behind one crib label.
# Focus ($mod+hjkl) and move ($mod+Shift+hjkl) stay flat above: your hands own
# those, they don't need a memory helper. Only the mouse-drag modifier stays here.
floating_modifier $mod

# ─── Workspaces ────────────────────────────────────────────────────────────
# Direct switch (Super+1..0)
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move container (Shift+Super+1..0)
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Bounce between the last two workspaces
bindsym $mod+Tab workspace back_and_forth

# Cycle workspaces. Home row is primary — the Ergodox has no arrow keys.
# The Ctrl+Alt+Arrow aliases are kept for when a normal keyboard is attached.
# (Ctrl+Alt+Up/Down are gone: they only duplicated Left/Right.)
bindsym $mod+Ctrl+h     workspace prev
bindsym $mod+Ctrl+l     workspace next
bindsym Ctrl+$alt+Left  workspace prev
bindsym Ctrl+$alt+Right workspace next

# Move container across workspaces
bindsym $mod+Ctrl+Shift+h     move container to workspace prev
bindsym $mod+Ctrl+Shift+l     move container to workspace next
bindsym Ctrl+Shift+$alt+Left  move container to workspace prev
bindsym Ctrl+Shift+$alt+Right move container to workspace next

# ─── i3 session ────────────────────────────────────────────────────────────
bindsym $mod+Shift+c reload
