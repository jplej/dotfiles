theme = "nord"

[editor]
line-number = "relative"
cursorline = true
auto-pairs = true
bufferline = "multiple"
true-color = true
rulers = [88]
clipboard-provider = "x-sel"
color-modes = true
auto-save = { focus-lost = true, after-delay.enable = true, after-delay.timeout = 3000 }

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding"]

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true
