[[language]]
name = "python"
language-servers = ["ruff"]
auto-format = true
formatter = { command = "ruff", args = ["format", "--stdin-filename", "file.py", "-"] }

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "markdown"
auto-format = false
text-width = 80
rulers = [80]

[language.soft-wrap]
enable = true
max-wrap = 80
