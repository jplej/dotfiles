# Prefix: Ctrl-a instead of Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Vim keys in copy mode
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Sane splits (v = vertical, s = horizontal, like vim) — open in current dir
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

# Mouse on
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Faster escape (important for helix)
set -sg escape-time 0

# Extended keys (shift-enter, ctrl-enter passthrough)
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Bigger scrollback
set -g history-limit 10000

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"

# Renumber windows when one is closed
set -g renumber-windows on

# Vi copy mode: v to select, y to yank to system clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
